<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qBittorrent</title>

  <!-- Google Fonts: served from Google's CDN, not the daemon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="app.css?v=3">
</head>
<body>

<div id="app">

  <!-- ── Error banner ────────────────────────────────────────────── -->

  <!-- ── Main area ────────────────────────────────────────────────── -->
  <div id="main-area">

    <!-- ── Mobile filter strip (hidden on desktop via CSS) ─────────── -->
    <div id="mobile-filter-strip" aria-label="Filter torrents" role="navigation">
      <div id="mobile-filter-chips">
        <div class="nav-indicator nav-indicator--h" id="mobile-chip-indicator" aria-hidden="true"></div>
        <button class="mobile-chip mobile-chip--active" data-filter="all" aria-pressed="true">
          All <span class="mobile-chip__count" id="mcount-all">—</span>
        </button>
        <button class="mobile-chip" data-filter="downloading" aria-pressed="false">
          Downloading <span class="mobile-chip__count" id="mcount-downloading">—</span>
        </button>
        <button class="mobile-chip" data-filter="seeding" aria-pressed="false">
          Seeding <span class="mobile-chip__count" id="mcount-seeding">—</span>
        </button>
        <button class="mobile-chip" data-filter="paused" aria-pressed="false">
          Paused <span class="mobile-chip__count" id="mcount-paused">—</span>
        </button>
        <button class="mobile-chip" data-filter="finished" aria-pressed="false">
          Finished <span class="mobile-chip__count" id="mcount-finished">—</span>
        </button>
        <button class="mobile-chip" data-filter="errors" aria-pressed="false">
          Errors <span class="mobile-chip__count" id="mcount-errors">—</span>
        </button>
        <button class="mobile-chip" data-filter="stalled" aria-pressed="false">
          Stalled <span class="mobile-chip__count" id="mcount-stalled">—</span>
        </button>
        <button class="mobile-chip" data-filter="checking" aria-pressed="false">
          Checking <span class="mobile-chip__count" id="mcount-checking">—</span>
        </button>
        <button class="mobile-chip" data-filter="moving" aria-pressed="false">
          Moving <span class="mobile-chip__count" id="mcount-moving">—</span>
        </button>
        <button class="mobile-chip" data-filter="fetching" aria-pressed="false">
          Fetching <span class="mobile-chip__count" id="mcount-fetching">—</span>
        </button>
      </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" aria-label="Filter torrents">
      <div class="sidebar-header">
        <button class="btn-ghost icon-btn tablet-sidebar-toggle" id="btn-tablet-sidebar"
                aria-label="Toggle sidebar" aria-expanded="false">
          <span class="icon icon--menu" aria-hidden="true"></span>
        </button>
        <span class="app-name">qBittorrent</span>
        <div id="conn-status" class="conn-status conn-status--connected"
             title="Connected" aria-label="Connection status"></div>
      </div>
      <div class="sidebar-scroll">
        <nav class="filter-nav">
          <div class="nav-indicator" id="filter-nav-indicator" aria-hidden="true"></div>
          <button class="filter-tab filter-tab--active" data-filter="all" aria-pressed="true">
            All
            <span class="filter-count" id="count-all">—</span>
          </button>
          <button class="filter-tab" data-filter="downloading" aria-pressed="false" hidden>
            Downloading
            <span class="filter-count" id="count-downloading">—</span>
          </button>
          <button class="filter-tab" data-filter="seeding" aria-pressed="false" hidden>
            Seeding
            <span class="filter-count" id="count-seeding">—</span>
          </button>
          <button class="filter-tab" data-filter="paused" aria-pressed="false" hidden>
            Paused
            <span class="filter-count" id="count-paused">—</span>
          </button>
          <button class="filter-tab" data-filter="fetching" aria-pressed="false" hidden>
            Fetching
            <span class="filter-count" id="count-fetching">—</span>
          </button>
          <button class="filter-tab" data-filter="finished" aria-pressed="false" hidden>
            Finished
            <span class="filter-count" id="count-finished">—</span>
          </button>
          <button class="filter-tab" data-filter="errors" aria-pressed="false" hidden>
            Errors
            <span class="filter-count" id="count-errors">—</span>
          </button>
          <button class="filter-tab" data-filter="checking" aria-pressed="false" hidden>
            Checking
            <span class="filter-count" id="count-checking">—</span>
          </button>
          <button class="filter-tab" data-filter="moving" aria-pressed="false" hidden>
            Moving
            <span class="filter-count" id="count-moving">—</span>
          </button>
          <button class="filter-tab" data-filter="stalled" aria-pressed="false" hidden>
            Stalled
            <span class="filter-count" id="count-stalled">—</span>
          </button>
        </nav>
        <div id="category-nav"></div>
      </div>
      <div class="sidebar-footer">
        <button class="alt-speed-btn" id="btn-alt-speed-indicator"
                aria-label="Alt speed active — click to disable"
                hidden>
          <span class="icon icon--moon" aria-hidden="true"></span>
        </button>
        <button class="speed-readout speed-readout--down" id="speed-down"
                aria-label="Download speed — click to configure limit">
          <span class="icon icon--arrow-down" aria-hidden="true"></span>
          <span class="speed-readout__value" id="speed-down-value">—</span>
        </button>
        <button class="speed-readout speed-readout--up" id="speed-up"
                aria-label="Upload speed — click to configure limit">
          <span class="icon icon--arrow-up" aria-hidden="true"></span>
          <span class="speed-readout__value" id="speed-up-value">—</span>
        </button>
      </div>
    </aside>

    <!-- Content pane: header floats free, table is its own card below it -->
    <div class="content-pane">
      <div class="list-area-header">
        <div id="mobile-filter-actions">
          <button class="btn-ghost icon-btn" id="btn-sort-filter" aria-label="Sort torrents">
            <span class="icon icon--sort" aria-hidden="true"></span>
          </button>
          <button class="btn-ghost icon-btn" id="btn-settings-filter" aria-label="Settings">
            <span class="icon icon--settings" aria-hidden="true"></span>
          </button>
          <button class="btn-ghost icon-btn" id="btn-add-filter" aria-label="Add torrent">
            <span class="icon icon--plus" aria-hidden="true"></span>
          </button>
        </div>
        <div class="toolbar__right">
          <button class="btn-ghost icon-btn icon-btn--glass" id="btn-add-torrent" aria-label="Add torrent" data-tooltip="Add torrent">
            <span class="icon icon--plus" aria-hidden="true"></span>
          </button>
          <div class="toolbar-group">
            <button class="btn-ghost icon-btn mobile-sort-btn" id="btn-mobile-sort"
                    aria-label="Sort torrents" title="Sort">
              <span class="icon icon--sort" aria-hidden="true"></span>
            </button>
            <button class="btn-ghost icon-btn" id="btn-log" aria-label="Application log" data-tooltip="Log">
              <span class="icon icon--log" aria-hidden="true"></span>
            </button>
            <button class="btn-ghost icon-btn" id="btn-settings" aria-label="Settings" data-tooltip="Settings">
              <span class="icon icon--settings" aria-hidden="true"></span>
            </button>
          </div>
          <div class="search-wrap">
            <span class="icon icon--search" aria-hidden="true"></span>
            <input type="text" id="search-input" class="search-input"
                   placeholder="Filter torrents…" autocomplete="off" spellcheck="false"
                   aria-label="Filter torrents by name">
            <button class="search-clear" id="search-clear"
                    aria-label="Clear search" hidden>
              <span class="icon--search-clear"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- List area -->
      <div id="list-area">
        <div id="col-headers" role="row">
          <button class="col col-name col-header" data-sort="name" aria-sort="none">Name</button>
          <button class="col col-size col-header" data-sort="size" aria-sort="none">Size</button>
          <button class="col col-dl col-header" data-sort="dlspeed" aria-sort="none"
                  aria-label="Download speed">↓</button>
          <button class="col col-ul col-header" data-sort="upspeed" aria-sort="none"
                  aria-label="Upload speed">↑</button>
          <button class="col col-peers col-header" data-sort="num_connected" aria-sort="none"
                  aria-label="Peers connected">Peers</button>
          <button class="col col-ratio col-header" data-sort="ratio" aria-sort="none">Ratio</button>
          <button class="col col-eta col-header" data-sort="eta" aria-sort="none">ETA</button>
          <button class="col col-pct col-header" data-sort="progress"
                  aria-sort="none" aria-label="Percent done">Done</button>
        </div>
        <div id="list-viewport" role="list" aria-label="Torrents" tabindex="0">
          <!-- Virtualiser renders rows here at runtime -->
        </div>
      </div>
    </div>

    <!-- Right panel — single container for Inspector, Settings, Add Torrent -->
    <div id="right-panel" aria-hidden="true">

      <!-- Inspector content -->
      <div id="inspector-content" class="right-panel__content" hidden>
        <div id="inspector-header">
          <button class="btn-ghost icon-btn" id="btn-inspector-close" aria-label="Close inspector">
            <span class="icon icon--x" aria-hidden="true"></span>
          </button>
        </div>
        <nav id="inspector-tabs" role="tablist" aria-label="Inspector sections">
          <div class="nav-indicator nav-indicator--h" id="inspector-tab-indicator" aria-hidden="true"></div>
          <button class="inspector-tab inspector-tab--active" role="tab"
                  aria-selected="true" aria-controls="tab-general" data-tab="general">General</button>
          <button class="inspector-tab" role="tab"
                  aria-selected="false" aria-controls="tab-files" data-tab="files">Files</button>
          <button class="inspector-tab" role="tab"
                  aria-selected="false" aria-controls="tab-peers" data-tab="peers">Peers</button>
          <button class="inspector-tab" role="tab"
                  aria-selected="false" aria-controls="tab-trackers" data-tab="trackers">Trackers</button>
        </nav>
        <div id="inspector-body">
          <div id="tab-general" class="inspector-panel" role="tabpanel"></div>
          <div id="tab-files"   class="inspector-panel inspector-panel--hidden" role="tabpanel"></div>
          <div id="tab-peers"   class="inspector-panel inspector-panel--hidden" role="tabpanel"></div>
          <div id="tab-trackers" class="inspector-panel inspector-panel--hidden" role="tabpanel"></div>
        </div>
      </div>

      <!-- Settings content -->
      <div id="settings-content" class="right-panel__content" hidden>
        <div class="right-panel__header">
          <span class="right-panel__title">Settings</span>
          <button class="btn-ghost icon-btn" id="btn-settings-close" aria-label="Close settings">
            <span class="icon icon--x" aria-hidden="true"></span>
          </button>
        </div>
        <div class="settings-nav-compact">
          <label class="settings-nav-label" for="settings-section-select">Section</label>
          <select id="settings-section-select">
            <option value="speed">Speed</option>
            <option value="downloads">Downloads</option>
            <option value="seeding">Seeding</option>
            <option value="peers">Peers</option>
            <option value="queue">Queue</option>
            <option value="about">About</option>
          </select>
        </div>
        <div class="settings-content">
          <div id="settings-body"></div>
        </div>
      </div>

      <!-- Log content -->
      <div id="log-content" class="right-panel__content" hidden>
        <div class="right-panel__header">
          <span class="right-panel__title">Log</span>
          <div style="display:flex;gap:var(--space-2);align-items:center;">
            <button class="btn-ghost btn--sm" id="btn-log-refresh" aria-label="Refresh log">
              <span class="icon icon--refresh-cw" aria-hidden="true"></span>
            </button>
            <button class="btn-ghost icon-btn" id="btn-log-close" aria-label="Close log">
              <span class="icon icon--x" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <div class="log-toolbar">
          <div class="log-filter-chips" role="group" aria-label="Filter by severity">
            <div class="nav-indicator nav-indicator--h" id="log-chip-indicator" aria-hidden="true"></div>
            <button class="log-chip log-chip--active" data-severity="all" aria-pressed="true">All</button>
            <button class="log-chip" data-severity="info" aria-pressed="false">Info</button>
            <button class="log-chip" data-severity="warning" aria-pressed="false">Warning</button>
            <button class="log-chip" data-severity="critical" aria-pressed="false">Critical</button>
          </div>
          <div class="file-search-bar log-search-bar">
            <div class="search-wrap">
              <span class="icon icon--log-search" aria-hidden="true"></span>
              <input type="text" id="log-search-input" class="search-input"
                     placeholder="Search log…" autocomplete="off" spellcheck="false"
                     aria-label="Search log entries">
              <button class="search-clear" id="log-search-clear"
                      aria-label="Clear log search" hidden>
                <span class="icon--search-clear"></span>
              </button>
            </div>
          </div>
        </div>
        <div id="log-body" class="log-body"></div>
      </div>

    </div><!-- /#right-panel -->

  </div><!-- /#main-area -->

</div><!-- /#app -->

<!-- ── Remove Confirmation modal ─────────────────────────────────── -->
<dialog id="modal-remove-confirm" aria-labelledby="modal-remove-title">
  <div class="modal-header">
    <h2 id="modal-remove-title" class="modal-title">Remove torrent?</h2>
  </div>
  <div class="modal-body">
    <p id="modal-remove-desc" class="modal-desc">—</p>
    <label class="checkbox-label">
      <input type="checkbox" id="remove-delete-data">
      Also delete torrent data from disk
    </label>
  </div>
  <div class="modal-footer modal-footer--stacked">
    <button class="btn-secondary btn--md modal-cancel">Cancel</button>
    <button class="btn-destructive btn--md" id="btn-remove-confirm">Remove</button>
  </div>
</dialog>

<!-- ── Set Location modal ─────────────────────────────────────────── -->
<dialog id="modal-set-location" aria-labelledby="modal-set-location-title">
  <div class="modal-header">
    <h2 class="modal-title" id="modal-set-location-title">Set Location</h2>
  </div>
  <div class="modal-body">
    <div class="form-row">
      <label class="form-label" for="set-location-path">Location</label>
      <input class="form-input" type="text" id="set-location-path"
             placeholder="/path/to/downloads" autocomplete="off" spellcheck="false">
    </div>
    <div class="form-row">
      <p class="form-hint" style="font-size:var(--type-caption);color:var(--color-text-secondary);margin:0">
        Existing data will be moved to the new location.
      </p>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-secondary btn--md" id="set-location-cancel">Cancel</button>
    <button class="btn-primary btn--md" id="set-location-confirm">Set Location</button>
  </div>
</dialog>

<!-- ── Rename modal ───────────────────────────────────────────────── -->
<dialog id="modal-rename" aria-labelledby="modal-rename-title">
  <div class="modal-header">
    <h2 class="modal-title" id="modal-rename-title">Rename</h2>
  </div>
  <div class="modal-body">
    <div class="form-row">
      <label class="form-label" for="rename-input">Name</label>
      <input class="form-input" type="text" id="rename-input"
             autocomplete="off" spellcheck="false">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-secondary btn--md" id="rename-cancel">Cancel</button>
    <button class="btn-primary btn--md" id="rename-confirm">Rename</button>
  </div>
</dialog>

<!-- ── Set Seed Ratio modal ───────────────────────────────────────── -->
<dialog id="modal-seed-ratio" aria-labelledby="modal-seed-ratio-title">
  <div class="modal-header">
    <h2 class="modal-title" id="modal-seed-ratio-title">Share Limit</h2>
  </div>
  <div class="modal-body">

    <!-- Top-level mode -->
    <div class="form-row">
      <label class="form-label" for="share-limit-mode">Mode</label>
      <div class="form-select-wrap">
        <select class="form-select" id="share-limit-mode">
          <option value="global">Use global share limit</option>
          <option value="none">Set no share limit</option>
          <option value="custom">Set share limit…</option>
        </select>
      </div>
    </div>

    <!-- Custom sub-rows (shown only when mode === "custom") -->
    <div id="share-limit-custom-rows" style="display:none;">

      <!-- Ratio -->
      <div class="form-row form-row--indent">
        <label class="form-label form-label--checkbox">
          <input type="checkbox" id="share-limit-ratio-enabled" class="form-checkbox">
          Ratio
        </label>
        <input type="text" inputmode="decimal" class="form-input" id="share-limit-ratio-value"
               placeholder="e.g. 2.0" autocomplete="off" style="width:80px;" disabled>
      </div>

      <!-- Total seeding time -->
      <div class="form-row form-row--indent">
        <label class="form-label form-label--checkbox">
          <input type="checkbox" id="share-limit-time-enabled" class="form-checkbox">
          Total time
        </label>
        <div style="display:flex;align-items:center;gap:var(--space-2);">
          <input type="text" inputmode="numeric" class="form-input" id="share-limit-time-value"
                 placeholder="minutes" autocomplete="off" style="width:80px;" disabled>
          <span class="form-select-hint">min</span>
        </div>
      </div>

      <!-- Inactive seeding time -->
      <div class="form-row form-row--indent">
        <label class="form-label form-label--checkbox">
          <input type="checkbox" id="share-limit-inactive-enabled" class="form-checkbox">
          Inactive time
        </label>
        <div style="display:flex;align-items:center;gap:var(--space-2);">
          <input type="text" inputmode="numeric" class="form-input" id="share-limit-inactive-value"
                 placeholder="minutes" autocomplete="off" style="width:80px;" disabled>
          <span class="form-select-hint">min</span>
        </div>
      </div>

    </div><!-- /share-limit-custom-rows -->

    <!-- Global hint line (shown when mode === "global") -->
    <p class="form-hint" id="share-limit-global-hint" style="display:none;"></p>

  </div>
  <div class="modal-footer">
    <button class="btn-secondary btn--md" id="share-limit-cancel">Cancel</button>
    <button class="btn-primary btn--md" id="share-limit-confirm">Apply</button>
  </div>
</dialog>

<!-- ── Add Torrent modal ───────────────────────────────────────────── -->
<dialog id="modal-add-torrent" aria-labelledby="modal-add-torrent-title">
  <div class="modal-header">
    <h2 class="modal-title" id="modal-add-torrent-title">Add Torrent</h2>
  </div>
  <div class="modal-body">
    <div class="dropzone" id="torrent-dropzone" tabindex="0"
         role="button" aria-label="Drop .torrent file here or click to browse">
      <span class="icon icon--file" aria-hidden="true"></span>
      <span class="dropzone__label">Drop .torrent file or click to browse</span>
      <input type="file" id="torrent-file-input" accept=".torrent" class="sr-only">
    </div>
    <div class="dropzone-filename" id="dropzone-filename" hidden></div>
    <div class="add-panel__divider">
      <span class="add-panel__divider-label">or</span>
    </div>
    <div class="field-group">
      <label class="field-label" for="magnet-input">Magnet link or URL</label>
      <textarea id="magnet-input" class="input textarea"
                placeholder="magnet:?xt=urn:btih:…" rows="3" spellcheck="false"></textarea>
    </div>
    <div class="field-group" style="margin-top: var(--space-4);">
      <label class="field-label" for="add-download-dir">Download to</label>
      <input type="text" id="add-download-dir" class="input" spellcheck="false">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn-secondary btn--md" id="btn-add-cancel">Cancel</button>
    <button class="btn-primary btn--md" id="btn-add-confirm" disabled>Add</button>
  </div>
</dialog>

<!-- ── Mobile sort bottom sheet ──────────────────────────────────── -->
<div id="sort-sheet" class="sort-sheet sort-sheet--hidden"
     role="dialog" aria-modal="true" aria-label="Options"
     aria-hidden="true">
  <div class="sort-sheet__header">
    <span class="sort-sheet__title">Sort by</span>
  </div>
  <div class="sort-sheet__body" role="listbox" aria-label="Sort options">
    <!-- Options injected by JS -->
  </div>
</div>
<div id="sort-sheet-backdrop" class="sort-sheet-backdrop sort-sheet-backdrop--hidden"
     aria-hidden="true"></div>

<!-- ── Context menu ──────────────────────────────────────────────── -->
<div id="context-menu" class="context-menu context-menu--hidden"
     role="menu" aria-label="Torrent actions">
  <!-- contextmenu.js populates and positions this -->
</div>

<!-- ── Toast container ───────────────────────────────────────────── -->
<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

<script src="js/format.js"></script>
<script src="js/icons.js"></script>
<script src="js/rpc.js"></script>
<script src="js/state.js"></script>
<script src="js/poll.js"></script>
<script src="js/row.js"></script>
<script src="js/list.js"></script>
<script src="js/toolbar.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/contextmenu.js"></script>
<script src="js/inspector.js"></script>
<script src="js/modals.js"></script>
<script src="js/settings.js"></script>
<script src="js/log.js"></script>
<script src="js/option-sheet.js"></script>
<script src="js/action-sheet.js"></script>
<script src="js/sort-sheet.js"></script>
<script src="js/mobile.js"></script>
<script src="js/main.js"></script>
</body>
</html>
